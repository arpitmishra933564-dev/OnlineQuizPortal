<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - QuizMaster</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            Quiz<span>Master</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="{{ url_for('home') }}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </li>

        </ul>

    </nav>

</header>


<section class="auth-section">

    <div class="auth-card">

        <div class="auth-icon">
            🧠
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Join QuizMaster and start testing your knowledge.
        </p>


        <form method="POST"
              action="{{ url_for('register') }}">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit"
                    class="auth-btn">

                Create Account

            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</section>

</body>

</html>
