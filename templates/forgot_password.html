<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - QuizMaster</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .forgot-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .forgot-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .forgot-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .forgot-card p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #554cff;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #f1f0ff;
            color: #5148d8;
        }

    </style>

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            Quiz<span>Master</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="{{ url_for('home') }}">Home</a>
            </li>

            <li>
                <a href="{{ url_for('login') }}">Login</a>
            </li>

            <li>
                <a href="{{ url_for('register') }}">Register</a>
            </li>

        </ul>

    </nav>

</header>


<div class="forgot-container">

    <div class="forgot-card">

        <h1>Reset Password</h1>

        <p>
            Enter your registered email and create a new password.
        </p>


        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Registered Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
            >
                Reset Password
            </button>

        </form>


        <div class="back-login">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</div>


</body>

</html>
