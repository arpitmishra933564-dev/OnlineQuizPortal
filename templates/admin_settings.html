<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Settings - QuizMaster</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f9;
        }


        .navbar {

            background: #222;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .navbar h2 {
            font-size: 24px;
        }


        .back {

            color: white;

            text-decoration: none;

            background: #3498db;

            padding: 10px 18px;

            border-radius: 5px;
        }


        .back:hover {
            background: #2980b9;
        }


        .container {

            width: 90%;

            max-width: 600px;

            margin: 40px auto;
        }


        .box {

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.1);
        }


        .box h1 {

            margin-bottom: 10px;

            color: #222;
        }


        .box p {

            color: #666;

            margin-bottom: 25px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 16px;
        }


        input:focus {

            outline: none;

            border-color: #3498db;
        }


        .btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 5px;

            background: #3498db;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        .btn:hover {
            background: #2980b9;
        }


        .error {

            background: #ffe6e6;

            color: #c0392b;

            padding: 12px;

            border-radius: 5px;

            margin-bottom: 20px;
        }


        .info {

            margin-top: 20px;

            background: #eef6ff;

            padding: 15px;

            border-radius: 5px;

            color: #555;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <h2>QuizMaster Admin</h2>

        <a href="{{ url_for('admin_dashboard') }}"
           class="back">

            ← Dashboard

        </a>

    </div>


    <!-- MAIN -->

    <div class="container">

        <div class="box">

            <h1>⚙️ Admin Settings</h1>

            <p>
                Change your admin username and password.
            </p>


            <!-- ERROR MESSAGE -->

            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}


            <!-- FORM -->

            <form method="POST">


                <!-- USERNAME -->

                <div class="form-group">

                    <label>
                        Admin Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        value="{{ username }}"
                        required
                    >

                </div>


                <!-- CURRENT PASSWORD -->

                <div class="form-group">

                    <label>
                        Current Password
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        placeholder="Enter current password"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        placeholder="Enter new password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label>
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn">

                    Update Admin Account

                </button>


            </form>


            <div class="info">

                <strong>Note:</strong>

                You must enter your current password
                before changing your username or password.

            </div>


        </div>

    </div>


</body>

</html>
