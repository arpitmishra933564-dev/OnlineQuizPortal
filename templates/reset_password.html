<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - QuizMaster</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .reset-container {
            min-height: 80vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .reset-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #f0efff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        .reset-card h1 {
            text-align: center;

            color: #182848;

            margin-bottom: 10px;
        }

        .reset-subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #333;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            box-sizing: border-box;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #6c63ff;

            box-shadow:
                0 0 0 3px rgba(108, 99, 255, 0.10);
        }

        .reset-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #6c63ff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .reset-btn:hover {
            background: #554cff;

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(108, 99, 255, 0.25);
        }

        .error-message {
            background: #ffecec;

            color: #d63031;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .back-login {
            text-align: center;

            margin-top: 25px;
        }

        .back-login a {
            color: #6c63ff;

            text-decoration: none;

            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<header>

    <nav class="navbar">

        <div class="logo">
            Quiz<span>Master</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="{{ url_for('home') }}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </li>

            <li>
                <a href="{{ url_for('register') }}">
                    Register
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- RESET PASSWORD -->

<main class="reset-container">


    <div class="reset-card">


        <div class="reset-icon">
            🔐
        </div>


        <h1>
            Reset Password
        </h1>


        <p class="reset-subtitle">
            Create a new password for your QuizMaster account.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('reset_password', email=email) }}"
        >


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
            >
                Reset Password
            </button>


        </form>


        <div class="back-login">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>


    </div>


</main>


<!-- FOOTER -->

<footer>

    <div class="logo">
        Quiz<span>Master</span>
    </div>

    <p>
        © 2026 QuizMaster. All Rights Reserved.
    </p>

</footer>


</body>

</html>
